const dayKey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();

function csvDownload(){

  const cell=v=>{let s=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const head=["Order","Placed","Status","Name","Phone","Email","City","Address","Items","Payment","Transaction ID","Delivery","Subtotal","Voucher","Discount","Delivery fee","Total","Courier","Tracking number","Payment verified","Note"];
  const rows=o.map(x=>[x.id,x.placedAt,x.status,x.customer.name,x.customer.phone,x.customer.email,x.customer.city,x.customer.address,x.lines.map(l=>l.name+" x"+l.qty).join("; "),PAYN[x.pay.method]||x.pay.method,x.pay.txn||"",x.delivery,x.totals.sub,x.voucher?x.voucher.code:"",x.voucher?x.voucher.discount:0,(x.totals.shipping||0)+(x.totals.tax||0),x.totals.total,x.courier||"",x.tracking||"",x.pay.method==="cod"?"":(x.payOk?"yes":"no"),x.note||""]);
  const blob=new Blob(["﻿"+[head,...rows].map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="malik-sports-orders-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Orders file downloaded");
}

  doc.head.appendChild(st);
  doc.addEventListener("click",onClick,true);
  ["keydown","keyup","keypress"].forEach(t=>doc.addEventListener(t,onKey,true));
  doc.addEventListener("paste",onPaste,true);
  doc.addEventListener("submit",e=>{if(mode==="edit")e.preventDefault()},true);
}
const okN=n=>{try{return S.ok(n)}catch(e){return false}};
function nodeAt(doc,x,y,t){
  let r=null;
  try{if(doc.caretRangeFromPoint)r=doc.caretRangeFromPoint(x,y);else if(doc.caretPositionFromPoint){const p=doc.caretPositionFromPoint(x,y);if(p){r=doc.createRange();r.setStart(p.offsetNode,p.offset)}}}catch(e){}
  const near=n=>{const g=doc.createRange();g.selectNodeContents(n);let best=1e9;for(const q of g.getClientRects()){const dx=x<q.left?q.left-x:x>q.right?x-q.right:0,dy=y<q.top?q.top-y:y>q.bottom?y-q.bottom:0;best=Math.min(best,Math.hypot(dx,dy))}return best};
  if(r&&r.startContainer.nodeType===3&&okN(r.startContainer)&&near(r.startContainer)<=12)return{n:r.startContainer,off:r.startOffset};
  let el=t;
  for(let up=0;el&&up<4;up++,el=el.parentElement){
    const w=doc.createTreeWalker(el,4,null);let n,best=null,bd=1e9;
    while((n=w.nextNode())){if(!okN(n))continue;const d=near(n);if(d<bd){bd=d;best=n}}
    if(best&&bd<=60)return{n:best,off:1e6};
  }
  return null;
}
function onClick(e){
  if(mode!=="edit")return;
  const t=e.target;
  if(t.closest&&t.closest("input,select,textarea"))return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
  if(t.closest&&t.closest(".ms-ed"))return;
  commit();
  const hit=nodeAt(fw.document,e.clientX,e.clientY,t);
  if(hit)start(hit.n,hit.off);else toast("Yahan koi text nahi mila. Kisi likhe hue lafz par dabayein.");
}
function onKey(e){
  const t=e.target;if(!t||!t.closest||!t.closest(".ms-ed"))return;
  e.stopPropagation();
  if(e.type==="keydown"){
    if(e.key==="Enter"){e.preventDefault();t.blur()}
    else if(e.key==="Escape"){e.preventDefault();commit(true)}
  }
}
function onPaste(e){
  const t=e.target;if(!t||!t.closest||!t.closest(".ms-ed"))return;
  e.preventDefault();
  const txt=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\s+/g," ");
  try{fw.document.execCommand("insertText",false,txt)}catch(x){}
}
function start(n,off){
  const doc=n.ownerDocument,key=S.key(n),orig=S.orig(n),v=n.nodeValue,m=/^(\s*)([\s\S]*?)(\s*)$/.exec(v);
  S.bind(n,orig);n.__msEditing=true;
  const sp=doc.createElement("span");
  sp.className="ms-ed";sp.setAttribute("contenteditable",PT?"plaintext-only":"true");sp.spellcheck=false;
  sp.textContent=m[2].replace(/\s+/g," ");
  const tail=doc.createTextNode(m[3]);
  n.parentNode.insertBefore(sp,n.nextSibling);sp.parentNode.insertBefore(tail,sp.nextSibling);
  n.nodeValue=m[1];
  cur={n,sp,tail,key,orig,m,before:sp.textContent};
  sp.addEventListener("blur",()=>setTimeout(()=>{if(cur&&cur.sp===sp)commit()},0));
  try{
    sp.focus({preventScroll:true});
    const sel=doc.defaultView.getSelection(),r=doc.createRange(),tn=sp.firstChild;
    if(tn){r.setStart(tn,Math.max(0,Math.min(tn.length,off-m[1].length)));r.collapse(true);sel.removeAllRanges();sel.addRange(r)}
  }catch(e){}
}
function commit(cancel){
  if(!cur)return;
  const c=cur;cur=null;
  const txt=cancel?c.before:c.sp.textContent.replace(/\s+/g," ").trim();
  c.sp.remove();c.tail.remove();c.n.__msEditing=false;
  c.n.nodeValue=c.m[1]+c.before+c.m[3];
  const base=S.norm(c.orig);
  if(txt!==c.before){
    if(!txt||txt===base)delete map[c.key];else map[c.key]=txt.slice(0,600);
  }
  S.set(map);hint();
}
function loaded(){
  try{fw=fr.contentWindow;S=fw.msSite;if(!S)throw 0;S.hold=true;S.set(map);if(!dirty()||!cur){const m2=S.edits();if(JSON.stringify(m2)!==JSON.stringify(map)){const wasSaved=!dirty();map=m2;if(wasSaved)saved=JSON.stringify(map)}}inject(fr.contentDocument)}
  catch(e){warn="Shop page edit ke liye load nahi hua. Naya index.html aur naya admin.html dono saath upload karein, phir dobara koshish karein.";hint();return}
  setMode(mode);
}
function save(){
  commit();
  const body=JSON.stringify(map),b=ov.querySelector("#se-save");b.disabled=true;
  msDb("PUT","site",body).then(()=>{
    saved=body;S&&S.cache();warn="";hint();toast("Save ho gaya. Shop par ab live hai.");
  },x=>{
    const m=x&&x.message;
    alert(m==="401"?"Save nahi hua: Firebase rules mein \"site\" wala hissa nahi hai.\n\nNaya firebase-rules.txt ka poora text Firebase Console > Realtime Database > Rules mein paste karke Publish karein, phir yahan dobara Save dabayein. Aapke badlav abhi screen par mehfooz hain."
      :m==="login"?"Aap ka login khatam ho gaya. Lock dabayein aur dobara sign in karein. (Badlav ke liye pehle Save dobara dabana hoga.)"
      :"Save nahi hua. Internet check karein aur dobara Save dabayein. Aapke badlav abhi screen par mehfooz hain.");
  }).then(()=>{b.disabled=false});
}
function close(){
  commit();
  if(dirty()&&!confirm("Badlav Save nahi hue. Phir bhi band karein?"))return;
  if(S)S.hold=false;
  try{fr.src="about:blank"}catch(e){}
  ov.remove();ov=fr=fw=S=null;cur=null;
  document.documentElement.style.overflow="";
  try{main()}catch(e){}
}
function open(){
  if(ov)return;
  warn="";mode="edit";
  ov=document.createElement("div");ov.id="se";
  ov.innerHTML=`<div class="se-bar"><div class="se-row"><button class="btn" data-se="close">✕ Band</button><div class="se-seg"><button data-se="m-edit" class="on">✏️ Edit</button><button data-se="m-browse">👆 Browse</button></div><button class="btn pri" data-se="save" id="se-save">Save</button></div><div class="se-chips">${PAGES.map(p=>`<button data-se="pg" data-p="${p[0]}">${p[1]}</button>`).join("")}<button data-se="menu">⋮ Menu</button><button data-se="reset">↺ Sab original</button></div><div class="se-hint" id="se-hint">Shop page khul raha hai…</div></div><iframe id="se-fr" title="Shop website" src="about:blank"></iframe>`;
  document.body.appendChild(ov);document.documentElement.style.overflow="hidden";
  fr=ov.querySelector("#se-fr");fr.addEventListener("load",()=>{if(fr.src!=="about:blank"&&fr.getAttribute("src")!=="about:blank")loaded()});
  ov.addEventListener("click",e=>{
    const b=e.target.closest&&e.target.closest("[data-se]");if(!b)return;
    const a=b.dataset.se;
    if(a==="close")close();
    else if(a==="save")save();
    else if(a==="m-edit")setMode("edit");
    else if(a==="m-browse")setMode("browse");
    else if(a==="pg"){commit();try{fw.location.hash=b.dataset.p}catch(x){}}
    else if(a==="menu"){commit();try{const m=fw.document.getElementById("more-menu");if(m)m.hidden=!m.hidden}catch(x){}}
    else if(a==="reset"){if(confirm("Sare badle hue text original par wapas karein? (Save dabane tak shop par asar nahi hoga.)")){commit();map={};if(S)S.set(map);hint()}}
  });
  msDb("GET","site").then(s=>{saved=typeof s==="string"?s:"{}";map=parse(saved);saved=JSON.stringify(map)},x=>{
    let c="";try{c=localStorage.getItem("ms-site-pk")||""}catch(e){}
    map=parse(c);saved=JSON.stringify(map);
    if(x&&x.message==="401")warn="Dhyan: Firebase rules mein abhi \"site\" nahi hai. Edit kar sakte hain, lekin Save se pehle naya firebase-rules.txt publish karna hoga.";
  }).then(()=>{if(ov){fr.src="index.html?edit="+Date.now()+"#home"}});
}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-a=site]");if(b)open()});
})();

ok()?boot():lock();
</script>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:#08090a}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
    color:#e9ecea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:center;
    background:
      radial-gradient(ellipse 85% 46% at 50% 14%,rgba(0,254,102,.20),rgba(0,254,102,.06) 55%,transparent 78%),
      radial-gradient(ellipse 120% 70% at 50% 100%,rgba(0,0,0,.55),transparent 70%),
      #08090a}
  .box{width:100%;max-width:340px}
  .logo{width:88px;height:88px;margin:0 auto 22px;border-radius:22px;filter:drop-shadow(0 0 22px rgba(0,254,102,.28));animation:glow 3.2s ease-in-out infinite}
  .logo svg{display:block;width:88px;height:88px}
  .logo.adm,.adm .logo.shop{display:none}
  .adm .logo.adm{display:block}
  h1{margin:0;font-family:"MS Anton",Anton,Impact,"Arial Narrow Bold","Helvetica Neue",sans-serif;font-weight:400;font-size:34px;line-height:1.05;letter-spacing:.015em;text-transform:uppercase;color:#fff}
  .sub{margin:12px 0 0;font-weight:700;font-size:14px;color:#00fe66}
  .slash{display:block;width:136px;height:12px;margin:14px auto 18px}
  p.msg{margin:0 0 24px;color:#b6b8bf;line-height:1.55;font-size:14.5px}
  button{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;display:block;width:100%;background:#00fe66;color:#03200e;font:inherit;font-weight:800;font-size:16px;padding:16px 20px;border-radius:14px;box-shadow:0 0 26px rgba(0,254,102,.42),0 6px 18px rgba(0,0,0,.4);transition:transform .12s ease,box-shadow .12s ease}
  button:active{transform:scale(.97);box-shadow:0 0 16px rgba(0,254,102,.35)}
  button:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .tip{margin:18px 0 0;padding:12px 14px;text-align:left;font-size:12.5px;line-height:1.5;color:#9b9da6;background:#141417;border:1px solid #26262b;border-radius:12px}
  .foot{margin-top:20px;font-size:12px;color:#6d6f78;letter-spacing:.02em}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(0,254,102,.22))}50%{filter:drop-shadow(0 0 28px rgba(0,254,102,.38))}}
  @media (prefers-reduced-motion:reduce){.logo{animation:none}button{transition:none}}
  @media (max-height:560px){.logo{margin-bottom:14px}.msg{margin-bottom:16px}}
</style>
